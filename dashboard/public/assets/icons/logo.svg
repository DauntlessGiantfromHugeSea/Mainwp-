<!--
	Das Zeichen von NorthLab: das N mit der Welle.

	Die viewBox ist auf die Form zugeschnitten, nicht auf die Zeichen-
	flaeche aus dem Zeichenprogramm — so fuellt das Zeichen den Platz,
	den es bekommt, statt in einem leeren Rand zu schwimmen.

	Zwei Pfade, sonst nichts. Die Vorlage malte die Welle ein zweites
	Mal als rund 170 Rechtecke in einem Clip-Pfad; das Ergebnis ist
	dasselbe, und ohne den Clip-Pfad bleibt die Form auch dort heil,
	wo sie nur als Maske benutzt wird.
-->
